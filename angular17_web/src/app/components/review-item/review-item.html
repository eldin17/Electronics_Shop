<div class="review-card">
  <div class="avatar">
    @if (reviewerImage) {
      <img [src]="reviewerImage" [alt]="reviewerName">
    } @else {
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    }
  </div>

  <div class="review-body">
    <p class="reviewer-name">{{ reviewerName }}</p>
    <div class="stars">
      @for (filled of starsArray; track $index) {
        <span class="star" [class.filled]="filled">★</span>
      }
    </div>
    <p class="review-comment">{{ review.comment }}</p>
  </div>
</div>
